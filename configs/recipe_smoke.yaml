data_root: data-smoke
tokenizer: {}
model:
  vocab_size: 264
  max_seq_len: 128
  d_model: 128
  n_layers: 2
  n_heads: 4
  n_kv_heads: 2
  ffn_mult: 2.5
  memory_slots: 8
  planning_steps: 2
  action_classes: 8
  tie_embeddings: true
train:
  output_dir: runs/smoke
  device: cpu
  max_steps: 3
  warmup_steps: 1
  lr: 1.0e-3
  micro_batch_size: 2
  grad_accum_steps: 1
  stage_order: [pretrain]
datasets:
  pretrain:
  - name: smoke-local
    repo: tests/fixtures/smoke_pretrain.jsonl
    split: train
    streaming: false
    max_examples: 8
    weight: 1.0
stages:
  pretrain: {max_steps: 3}
