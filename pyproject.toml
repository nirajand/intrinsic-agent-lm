[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intrinsic-agent-lm"
version = "0.2.0"
description = "Staged training/data pipeline with native agentic modules for research and experimentation"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5",
  "safetensors>=0.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
data = [
  "datasets>=3.0",
  "huggingface_hub>=0.28",
  "transformers>=4.50",
]
test = [
  "pytest>=8",
]
all = [
  "datasets>=3.0",
  "huggingface_hub>=0.28",
  "transformers>=4.50",
  "pytest>=8",
]

[project.scripts]
ialm = "ialm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
